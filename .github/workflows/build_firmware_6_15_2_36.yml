name: Build Custom Mechatronics Firmware
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom repo
        uses: actions/checkout@v4

      - name: Install ARM GCC compiler toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            build-essential \
            libffi-dev \
            pkg-config \
            libnewlib-arm-none-eabi

      # 1. SETUP CLOUD CACHE BUCKET FOR REPOSITORIES
      - name: Cache MicroPython and ulab sources
        id: cache-sources
        uses: actions/cache@v4
        with:
          path: |
            mp_source
            ulab
          # This key ties the cache strictly to the latest online commit of both tools
          key: ${{ runner.os }}-mp-source-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mp-source-

      # 2. ONLY CLONE IF CACHE MISS OCCURS
      - name: Clone MicroPython source (Cache Miss Only)
        if: steps.cache-sources.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/micropython/micropython.git mp_source
          cd mp_source
          git submodule update --init --recursive

      - name: Clone ulab (Cache Miss Only)
        if: steps.cache-sources.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/v923z/micropython-ulab.git ulab
          cd ulab
          git submodule update --init --recursive

      # 3. INJECT REPO CONFIGURATIONS (Always run this because your repo files might have edited properties)
      - name: Inject custom ulab configuration
        run: |
          cp third_party/ulab/ulab.h "$GITHUB_WORKSPACE/ulab/code/ulab.h"

      - name: Inject custom board definitions
        run: |
          mkdir -p mp_source/ports/stm32/boards/NUCLEO_L476RG
          if [ -d "ports/stm32/boards/NUCLEO_L476RG" ]; then
            cp -r ports/stm32/boards/NUCLEO_L476RG/* mp_source/ports/stm32/boards/NUCLEO_L476RG/
          fi

      # 4. CONDITIONAL MPY-CROSS BUILD (Skips completely if cache restored it)
      - name: Build mpy-cross
        if: steps.cache-sources.outputs.cache-hit != 'true'
        run: |
          make -C mp_source/mpy-cross

      - name: Freeze Custom Class Modules into Firmware
        run: |
          if [ -d "modules" ]; then
            echo "Custom Python scripts detected. Freezing modules into Flash sectors..."
            mkdir -p mp_source/ports/stm32/boards/NUCLEO_L476RG/modules
            cp -r modules/* mp_source/ports/stm32/boards/NUCLEO_L476RG/modules/
          else
            echo "No 'modules' directory found. Skipping code freezing."
          fi

      - name: Fetch STM32 Board Submodules
        run: |
          # Explicitly build submodules needed specifically for STM32 architecture
          make -C mp_source/ports/stm32 BOARD=NUCLEO_L476RG submodules

      # 5. COMPILE FIRMWARE (Always runs to process changes)
      - name: Build STM32 firmware with ulab
        run: |
          make -C mp_source/ports/stm32 \
            BOARD=NUCLEO_L476RG \
            USER_C_MODULES="$GITHUB_WORKSPACE/ulab" \
            FROZEN_MANIFEST=boards/NUCLEO_L476RG/manifest.py \
            V=1


      # 6. Upload FIRMWARE (Always runs)
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: custom-nucleo-l476rg-firmware
          path: |
            mp_source/ports/stm32/build-NUCLEO_L476RG/firmware.hex
            mp_source/ports/stm32/build-NUCLEO_L476RG/firmware.dfu
