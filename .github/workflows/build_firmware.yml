name: Build Custom Mechatronics Firmware
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  MICROPYTHON_REF: master
  ULAB_REF: master
  CACHE_VERSION: v2
  GENERATE_REGISTER_INTERFACE: ${{ vars.GENERATE_REGISTER_INTERFACE || 'true' }}
  MICROPY_FROZEN_OPT_LEVEL: ${{ vars.MICROPY_FROZEN_OPT_LEVEL || '0' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Phase 1: Check out this repository and install the minimal native and ARM
      # toolchains needed to build mpy-cross and STM32 firmware.
      - name: Checkout custom repo
        uses: actions/checkout@v4

      - name: Install ARM GCC compiler toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            build-essential \
            libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version

      # Phase 2: Resolve exact upstream source revisions so cache keys track
      # MicroPython and ulab changes without recloning them on every repo commit.
      - name: Resolve upstream source revisions
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          mp_sha="$(git ls-remote https://github.com/micropython/micropython.git "refs/heads/${MICROPYTHON_REF}" | awk '{print $1}')"
          ulab_sha="$(git ls-remote https://github.com/v923z/micropython-ulab.git "refs/heads/${ULAB_REF}" | awk '{print $1}')"

          if [ -z "$mp_sha" ]; then
            echo "::error::Could not resolve MicroPython ref '${MICROPYTHON_REF}'"
            exit 1
          fi

          if [ -z "$ulab_sha" ]; then
            echo "::error::Could not resolve ulab ref '${ULAB_REF}'"
            exit 1
          fi

          echo "micropython_sha=$mp_sha" >> "$GITHUB_OUTPUT"
          echo "ulab_sha=$ulab_sha" >> "$GITHUB_OUTPUT"

      # Phase 3: Restore cached external sources and build outputs. The key also
      # includes local board, ulab, generator, and frozen-module opt settings.
      - name: Cache MicroPython, ulab, and build outputs
        id: cache-firmware
        uses: actions/cache@v4
        with:
          path: |
            mp_source
            ulab
          key: ${{ runner.os }}-firmware-${{ env.CACHE_VERSION }}-opt${{ env.MICROPY_FROZEN_OPT_LEVEL }}-${{ steps.upstream.outputs.micropython_sha }}-${{ steps.upstream.outputs.ulab_sha }}-${{ hashFiles('ports/stm32/boards/NUCLEO_L476RG/**', 'third_party/ulab/**', 'tools/**') }}
          restore-keys: |
            ${{ runner.os }}-firmware-${{ env.CACHE_VERSION }}-opt${{ env.MICROPY_FROZEN_OPT_LEVEL }}-${{ steps.upstream.outputs.micropython_sha }}-${{ steps.upstream.outputs.ulab_sha }}-
            ${{ runner.os }}-firmware-${{ env.CACHE_VERSION }}-

      # Phase 4: Prepare the external source trees restored from cache, fetching
      # only when the cache is missing or behind the resolved upstream revisions.
      - name: Prepare MicroPython source
        shell: bash
        run: |
          set -euxo pipefail
          if [ -d mp_source/.git ]; then
            git -C mp_source remote set-url origin https://github.com/micropython/micropython.git
            git -C mp_source fetch --depth=1 origin "${MICROPYTHON_REF}"
          else
            rm -rf mp_source
            git clone --depth=1 --branch "${MICROPYTHON_REF}" https://github.com/micropython/micropython.git mp_source
          fi
          git -C mp_source checkout --detach "${{ steps.upstream.outputs.micropython_sha }}"
          git -C mp_source reset --hard "${{ steps.upstream.outputs.micropython_sha }}"

      - name: Prepare ulab source
        shell: bash
        run: |
          set -euxo pipefail
          if [ -d ulab/.git ]; then
            git -C ulab remote set-url origin https://github.com/v923z/micropython-ulab.git
            git -C ulab fetch --depth=1 origin "${ULAB_REF}"
          else
            rm -rf ulab
            git clone --depth=1 --branch "${ULAB_REF}" https://github.com/v923z/micropython-ulab.git ulab
          fi
          git -C ulab checkout --detach "${{ steps.upstream.outputs.ulab_sha }}"
          git -C ulab reset --hard "${{ steps.upstream.outputs.ulab_sha }}"
          if [ -f ulab/.gitmodules ]; then
            git -C ulab submodule update --init --recursive --depth=1
          fi

      # Phase 5: Optionally generate the frozen register interface and metadata
      # from tools/register_definitions.json.
      - name: Generate register interface module
        if: ${{ env.GENERATE_REGISTER_INTERFACE != 'false' }}
        shell: bash
        run: |
          set -euxo pipefail
          python3 register_map_generator.py
          test -s registerinterface.py
          shopt -s nullglob
          metadata_files=(register_metadata_*.json)
          if [ "${#metadata_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one register_metadata_*.json file, found ${#metadata_files[@]}"
            exit 1
          fi
          test -s "${metadata_files[0]}"
          mkdir -p ../ports/stm32/boards/NUCLEO_L476RG/modules
          cp registerinterface.py ../ports/stm32/boards/NUCLEO_L476RG/modules/registerinterface.py
        working-directory: tools

      # Phase 6: Inject this repository's ulab configuration and custom board
      # definitions into the prepared MicroPython source tree.
      - name: Inject custom ulab configuration
        shell: bash
        run: |
          test -f third_party/ulab/ulab.h
          test -d "$GITHUB_WORKSPACE/ulab/code"
          cp third_party/ulab/ulab.h "$GITHUB_WORKSPACE/ulab/code/ulab.h"

      - name: Inject custom board definitions
        shell: bash
        run: |
          SRC="ports/stm32/boards/NUCLEO_L476RG"
          DST="mp_source/ports/stm32/boards/NUCLEO_L476RG"
          rm -rf "$DST"
          mkdir -p "$DST"
          if [ -d "$SRC" ]; then
            cp -a "$SRC"/. "$DST"/
          fi

      # Phase 7: Build mpy-cross. make is fast when the cached build is current.
      - name: Build mpy-cross
        run: |
          make -C mp_source/mpy-cross

      # Phase 8: Copy frozen Python modules into the prepared board directory so
      # the STM32 firmware build can compile them with mpy-cross.
      - name: Freeze Custom Class Modules into Firmware
        shell: bash
        run: |
          SRC="ports/stm32/boards/NUCLEO_L476RG/modules"
          DST="mp_source/ports/stm32/boards/NUCLEO_L476RG/modules"
          if [ -d "$SRC" ]; then
            echo "Custom Python scripts detected. Freezing modules into Flash sectors..."
            rm -rf "$DST"
            mkdir -p "$DST"
            cp -a "$SRC"/. "$DST"/
          else
            echo "No 'modules' directory found. Skipping code freezing."
          fi

      # Phase 9: Fetch STM32-only MicroPython submodules required by this board.
      - name: Fetch STM32 Board Submodules
        run: |
          make -C mp_source/ports/stm32 BOARD=NUCLEO_L476RG submodules

      # Phase 10: Compile the STM32 firmware with ulab and frozen custom modules.
      - name: Build STM32 firmware with ulab
        run: |
          make -C mp_source/ports/stm32 \
            BOARD=NUCLEO_L476RG \
            USER_C_MODULES="$GITHUB_WORKSPACE/ulab" \
            FROZEN_MANIFEST=boards/NUCLEO_L476RG/manifest.py \
            V=1

      # Phase 11: Collect firmware images and generated register metadata into a
      # single artifact directory. firmware.hex is required; bin/dfu are included
      # when the MicroPython STM32 build emits them.
      - name: Stage firmware artifacts
        shell: bash
        run: |
          set -euxo pipefail
          build_dir="mp_source/ports/stm32/build-NUCLEO_L476RG"
          artifact_dir="$GITHUB_WORKSPACE/artifacts"

          mkdir -p "$artifact_dir"
          test -s "$build_dir/firmware.hex"
          cp "$build_dir/firmware.hex" "$artifact_dir/"

          for image in firmware.bin firmware.dfu; do
            if [ -s "$build_dir/$image" ]; then
              cp "$build_dir/$image" "$artifact_dir/"
            else
              echo "::warning::$build_dir/$image was not produced"
            fi
          done

          shopt -s nullglob
          metadata_files=(tools/register_metadata_*.json)
          if [ "${GENERATE_REGISTER_INTERFACE}" != "false" ]; then
            if [ "${#metadata_files[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one tools/register_metadata_*.json file, found ${#metadata_files[@]}"
              exit 1
            fi
            cp "${metadata_files[0]}" "$artifact_dir/"
          elif [ "${#metadata_files[@]}" -gt 0 ]; then
            cp "${metadata_files[@]}" "$artifact_dir/"
          fi

          find "$artifact_dir" -maxdepth 1 -type f -print

      # Phase 12: Upload the staged firmware images and register metadata.
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: custom-nucleo-l476rg-firmware
          path: artifacts/*
          if-no-files-found: error
